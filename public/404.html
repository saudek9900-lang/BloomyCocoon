<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found | BloomyCocoon</title>
    <style>
      :root {
        color-scheme: light;
        --surface: #fffaf7;
        --ink: #38241f;
        --muted: #6f5b55;
        --primary: #8d493a;
        --primary-soft: #f5dfd8;
        --outline: rgba(77, 54, 48, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(circle at top left, rgba(245, 223, 216, 0.82), transparent 34rem),
          var(--surface);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(100%, 560px);
        text-align: center;
      }

      .brand {
        margin: 0 0 24px;
        color: var(--primary);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 8vw, 3.25rem);
        line-height: 1;
      }

      .label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 64px;
        min-height: 36px;
        margin-bottom: 18px;
        border: 1px solid var(--outline);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 9vw, 4rem);
        line-height: 1.04;
      }

      p {
        margin: 18px auto 0;
        max-width: 34rem;
        color: var(--muted);
        font-size: 1rem;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 32px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid var(--outline);
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
      }

      a:first-child {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      a:focus-visible {
        outline: 3px solid var(--primary-soft);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">BloomyCocoon</p>
      <span class="label">404</span>
      <h1>This page is not stitched yet.</h1>
      <p>The page you opened is not part of the BloomyCocoon website. You can return home, browse handmade crochet gifts, or start a custom order.</p>
      <nav aria-label="Helpful links">
        <a href="/">Home</a>
        <a href="/collections">Collection</a>
        <a href="/custom-order">Custom Order</a>
        <a href="/contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
